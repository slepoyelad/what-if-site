<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<!--
  The page itself holds no data. It reads the private repo slepoyelad/what_if_question
  (the `dashboard` branch and the Actions runs) through the GitHub API with a token that
  the owner types in once; the token stays in this phone's browser only.
-->
<style>
:root {
  color-scheme: light;
  --bg: #f4f3fa;
  --card: #ffffff;
  --card-2: #f0eef8;
  --line: #e2dfee;
  --text: #17142b;
  --text-2: #57536e;
  --muted: #8a87a0;
  --accent: #6d4ce6;
  --accent-ink: #ffffff;
  --good: #0a7d3c;
  --warn: #9a6200;
  --bad: #c0362c;
  --s1: #2a78d6; /* instagram */
  --s2: #eb6834; /* youtube */
  --s3: #1baf7a; /* facebook */
  --s4: #6250d6; /* tiktok */
  --shadow: 0 1px 2px rgba(20, 10, 60, .06), 0 4px 16px rgba(20, 10, 60, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f0c22;
    --card: #1a1634;
    --card-2: #231e43;
    --line: #2f2a52;
    --text: #f1effb;
    --text-2: #c2bedb;
    --muted: #8e89ad;
    --accent: #8f74ff;
    --accent-ink: #0f0c22;
    --good: #3ccf7c;
    --warn: #f0b440;
    --bad: #ff7468;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #9085e9;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f0c22; --card: #1a1634; --card-2: #231e43; --line: #2f2a52; --text: #f1effb; --text-2: #c2bedb; --muted: #8e89ad;
  --accent: #8f74ff; --accent-ink: #0f0c22; --good: #3ccf7c; --warn: #f0b440; --bad: #ff7468;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #9085e9; --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 Rubik, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
}
main { max-width: 720px; margin: 0 auto; padding: 0 16px; }
header.top {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; margin-top: calc(-1 * env(safe-area-inset-top));
}
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.top img { width: 36px; height: 36px; border-radius: 10px; }
.top h1 { font-size: 18px; margin: 0; line-height: 1.2; }
.top .sub { font-size: 12px; color: var(--muted); }
.project-nav { display: inline-flex; align-items: center; min-height: 32px; font-size: 13px; color: var(--accent); text-decoration: none; }
.project-nav:hover, .project-nav:focus-visible { text-decoration: underline; }
.top .grow { flex: 1; min-width: 0; }
button, .btn {
  font: inherit; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
  background: var(--card-2); color: var(--text); font-weight: 500;
}
button:disabled { opacity: .55; cursor: default; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-danger { background: transparent; color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); }
.btn-ghost { background: transparent; color: var(--text-2); }
.icon-btn { width: 44px; padding: 0; border-radius: 50%; }
section { margin: 18px 0 26px; }
h2 { font-size: 17px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
h2 .count { background: var(--accent); color: var(--accent-ink); border-radius: 999px; font-size: 12px; padding: 1px 8px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
.stack > * + * { margin-top: 12px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.split { justify-content: space-between; }
.banner { border-radius: 14px; padding: 10px 14px; background: var(--card-2); display: flex; gap: 10px; align-items: center; font-size: 14px; }
.banner a { color: inherit; }
.banner.prog { display: grid; gap: 8px; text-decoration: none; }
.banner.prog .dot { display: inline-block; margin-inline-end: 6px; vertical-align: middle; }
.bar { height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 18%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); transition: width .6s ease; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.error { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.error b { color: var(--bad); }

/* pending reels */
.reel { display: grid; grid-template-columns: 116px 1fr; gap: 14px; }
.thumb { position: relative; width: 116px; aspect-ratio: 9/16; border-radius: 12px; overflow: hidden; background: var(--card-2); }
.thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb .play { position: absolute; inset: 0; margin: auto; width: 52px; height: 52px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; font-size: 20px; padding: 0; }
.thumb .noprev { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 8px; font-size: 12px; color: var(--muted); }
.reel h3 { font-size: 16px; margin: 0 0 4px; line-height: 1.35; direction: ltr; text-align: right; unicode-bidi: plaintext; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; background: var(--card-2); color: var(--text-2); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.caption { font-size: 13px; color: var(--text-2); direction: ltr; text-align: left; white-space: pre-wrap; max-height: 4.6em; overflow: hidden; margin: 6px 0 0; }
.caption.open { max-height: none; }
.actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
details.opts { margin-top: 8px; font-size: 14px; }
details.opts summary { color: var(--muted); cursor: pointer; padding: 4px 0; }
.opts-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--text-2); }
select, input[type=text], input[type=password], textarea {
  font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); min-height: 44px;
}
.sent { color: var(--good); font-weight: 500; }
@media (max-width: 380px) { .reel { grid-template-columns: 96px 1fr; } .thumb { width: 96px; } }

/* numbers */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
.kpi .v { font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi .chg { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; }
.kpi .pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums; direction: ltr; }
.kpi .pill.up { color: var(--good); background: color-mix(in srgb, var(--good) 16%, transparent); }
.kpi .pill.down { color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, transparent); }
.kpi .pill.same { color: var(--muted); background: color-mix(in srgb, var(--muted) 14%, transparent); }
.kpi .was { color: var(--muted); opacity: .8; }
.kpisince { margin-top: 8px; font-size: 12px; color: var(--muted); }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { font-weight: 500; color: var(--muted); font-size: 12px; text-align: start; padding: 6px 4px; border-bottom: 1px solid var(--line); }
td { padding: 9px 4px; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: left; }
.metric-cell { white-space: nowrap; }
.metric-change { display:inline-block; padding:1px 5px; border-radius:12px; font-size:.8em; font-weight:600; color:var(--muted); background:var(--card-2); }
.metric-change.up { color:var(--good); background:color-mix(in srgb,var(--good) 16%,transparent); }
.metric-change.down { color:var(--bad); background:color-mix(in srgb,var(--bad) 16%,transparent); }
@media(max-width:460px){.metric-cell .metric-change { display:block; width:max-content; margin-inline-start:auto; }}
.pl { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.chart-wrap { position: relative; }
.chart-wrap svg { direction: ltr; display: block; width: 100%; height: auto; overflow: visible; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; border-radius: 8px; padding: 6px 8px; white-space: nowrap; transform: translate(-50%, -110%); opacity: 0; transition: opacity .1s; }
.tip.on { opacity: 1; }
.empty { font-size: 14px; color: var(--muted); padding: 6px 0; }

/* reel list */
.pub { padding: 12px 0; border-bottom: 1px solid var(--line); }
.pub:last-child { border-bottom: 0; padding-bottom: 2px; }
.pub:first-child { padding-top: 2px; }
.qcard { padding: 6px 12px 10px; }
.qnow { margin: 6px 0 4px; padding: 12px; border-radius: 14px; background: color-mix(in srgb, var(--accent) 14%, transparent); }
.qnow-l { font-size: 12px; color: var(--accent); font-weight: 600; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.qnow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: qpulse 1.4s ease-in-out infinite; }
@keyframes qpulse { 50% { opacity: .3; } }
.qplat { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.qplat span { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--card); color: var(--muted); }
.qplat span.ok { color: var(--good); }
.qrow { border-bottom: 1px solid var(--line); }
.qrow.moved { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 12px; }
.qmain { display: flex; align-items: center; gap: 10px; padding: 10px 2px; cursor: pointer; }
.qpos { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: var(--card-2); color: var(--text-2); }
.qrow.first .qpos { background: var(--accent); color: var(--accent-ink); }
.qbody { flex: 1; min-width: 0; }
.qt2 { font-weight: 500; font-size: 15px; line-height: 1.3; direction: ltr; text-align: right; unicode-bidi: plaintext; }
.qwhen { font-size: 12px; color: var(--muted); margin-top: 2px; }
.qerr { font-size: 12px; color: var(--bad); white-space: pre-line; padding: 0 2px 8px; }
.qacts { display: flex; gap: 8px; padding: 0 38px 12px 2px; }
.mv { display: inline-flex; gap: 4px; flex: none; }
.mv button { width: 36px; height: 34px; padding: 0; font-size: 14px; line-height: 1; border-radius: 10px; }
.mv button:disabled { opacity: 0.2; }
.qhow { font-size: 12px; color: var(--muted); text-align: center; padding-top: 10px; }
.qsave { position: sticky; bottom: 10px; margin-top: 12px; padding: 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
.pub .t { font-weight: 500; direction: ltr; text-align: right; unicode-bidi: plaintext; }
.plats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; }
.plat { display: flex; align-items: center; gap: 8px; background: var(--card-2); border-radius: 10px; padding: 7px 10px; font-size: 13px; color: var(--text); text-decoration: none; }
.plat .num { margin-inline-start: auto; font-variant-numeric: tabular-nums; color: var(--text-2); }
ul.tips { margin: 0; padding-inline-start: 20px; }
h2.hrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.abtn { font-size: 13px; font-weight: 500; padding: 7px 14px; min-height: 36px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.atips { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; max-height: 60vh; overflow-y: auto; }
.atip { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 14px; background: var(--card-2); line-height: 1.45; font-size: 14px; }
.atip .ai { font-size: 20px; line-height: 1.2; flex: none; }
ul.tips li + li { margin-top: 6px; }
ol.queue { margin: 6px 0 0; padding-inline-start: 22px; direction: ltr; text-align: left; }
.queue li { padding: 2px 0; }
.rtitle { display: block; direction: ltr; text-align: left; font-weight: 700; font-size: 15px; line-height: 1.35; margin: 2px 0 2px; padding: 8px 12px; border-radius: 12px; background: linear-gradient(90deg, rgba(124,92,255,.22), rgba(70,140,255,.14)); color: var(--text, #fff); }
.queue li { display: list-item; }
.queue .qt { display: inline; }
.drop { all: unset; cursor: pointer; margin-inline-start: 8px; padding: 2px 8px; border-radius: 99px; font-size: 12px; color: var(--muted); border: 1px solid rgba(140,135,170,.35); direction: rtl; }
.drop.armed { color: #fff; background: var(--bad, #e5484d); border-color: transparent; }
#qbox > summary, #pubbox > summary { list-style: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
#qbox > summary::-webkit-details-marker, #pubbox > summary::-webkit-details-marker { display: none; }
.qhead { display: flex; align-items: center; gap: 10px; }
#pubbox .qhead { justify-content: space-between; }
.qhead .qnext { flex: 1; font-weight: 400; }
.qarrow { font-size: 16px; color: var(--muted, #9a94c0); transition: transform .2s; }
#qbox[open] .qarrow, #pubbox[open] .qarrow { transform: rotate(180deg); }
.fold { margin-top: 12px; }
.fold > summary { list-style: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.fold > summary::-webkit-details-marker { display: none; }
.foldhead { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); font-weight: 600; font-size: 14px; }
.fold[open] .qarrow { transform: rotate(180deg); }
.fmt { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; margin-inline-start: 4px; direction: rtl; background: rgba(140,120,255,.18); color: #b9a8ff; }
.fmt.catch { background: rgba(255,170,60,.18); color: #ffbe6b; }

/* modal */
.sheet-bg { position: fixed; inset: 0; background: rgba(5, 3, 15, .55); z-index: 20; display: none; align-items: flex-end; justify-content: center; }
.sheet-bg.on { display: flex; }
.sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 20px 16px calc(env(safe-area-inset-bottom) + 18px); }
.sheet h3 { margin: 0 0 6px; font-size: 18px; }
.sheet .row { margin-top: 16px; }
.sheet .row button { flex: 1; }
.toast { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 18px); left: 16px; right: 16px; max-width: 520px; margin: 0 auto; background: var(--text); color: var(--bg); padding: 12px 14px; border-radius: 12px; z-index: 30; font-size: 14px; display: none; }
.toast.on { display: block; }

/* login */
.login { max-width: 460px; margin: 8vh auto 0; }
.login ol { padding-inline-start: 20px; color: var(--text-2); font-size: 14px; }
.login ol li + li { margin-top: 6px; }
.login a { color: var(--accent); }
.spin { width: 18px; height: 18px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: r .8s linear infinite; display: inline-block; }
@keyframes r { to { transform: rotate(360deg); } }
footer { margin: 30px 0 10px; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-bg" id="sheet"><div class="sheet" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const REPO = "slepoyelad/what_if_question";
const API = "https://api.github.com/repos/" + REPO;
const TOKEN_KEY = "wiq.token";
const SENT_KEY = "wiq.sent";
const PLATFORMS = [
  { id: "instagram", he: "אינסטגרם", color: "var(--s1)" },
  { id: "youtube", he: "יוטיוב", color: "var(--s2)" },
  { id: "facebook", he: "פייסבוק", color: "var(--s3)" },
  { id: "tiktok", he: "טיקטוק", color: "var(--s4)" },
];
const WORKFLOW_HE = {
  "Make a reel": "הבוט מכין סרטון חדש", "Publish a reel": "מפרסם סרטון", "Daily stats": "מושך מספרים חדשים",
  "Review a reel": "שומר את ההחלטה שלך", "Publish queue": "מפרסם מהתור", "Update dashboard": "מעדכן את הלוח", "TikTok login": "התחברות לטיקטוק",
};
const CATEGORY_HE = {
  science_space: "מדע וחלל", money: "כסף", tech_wrong_time: "טכנולוגיה", superpowers_fantasy: "כוחות על",
  life_elsewhere: "חיים במקום אחר", alt_history: "היסטוריה חלופית", geopolitics: "גאופוליטיקה",
};

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let token = store.get(TOKEN_KEY);
let state = { data: null, runs: [], steps: {}, history: null, makeRuns: [], branch: "main", loading: false, error: null, noData: false, lastLoad: 0 };
const blobs = new Map();

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => (n == null ? "–" : Number(n).toLocaleString("he-IL"));
const short = (n) => {
  if (n == null) return "–";
  if (n >= 1e6) return parseFloat((n / 1e6).toFixed(n >= 1e7 ? 0 : 1)) + "M";
  if (n >= 1e4) return parseFloat((n / 1e3).toFixed(n >= 1e5 ? 0 : 1)) + "K";
  return fmt(n);
};
const utc = (s) => (s ? new Date(String(s).includes("T") ? s : String(s).replace(" ", "T") + "Z") : null);
function ago(d) {
  if (!d) return "";
  const m = Math.round((Date.now() - d.getTime()) / 60000);
  if (m < 1) return "עכשיו";
  if (m < 60) return m === 1 ? "לפני דקה" : `לפני ${m} דקות`;
  const h = Math.round(m / 60);
  if (h < 24) return h === 1 ? "לפני שעה" : `לפני ${h} שעות`;
  const days = Math.round(h / 24);
  return days === 1 ? "אתמול" : `לפני ${days} ימים`;
}
const when = (d) => (d ? d.toLocaleString("he-IL", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) : "");

function toast(msg, ms = 3500) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("on"), ms);
}

// ---- GitHub API ---------------------------------------------------------------------------
async function gh(path, opts = {}) {
  const res = await fetch(path.startsWith("http") ? path : API + path, {
    cache: "no-store",
    ...opts,
    headers: { Authorization: "Bearer " + token, Accept: opts.accept || "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) },
  });

async function load(full = true, soft = false) {
  if (state.loading) return;
  state.loading = true; if (!soft) render(true);
  try {
    const jobs = [ghJson("/actions/runs?per_page=15").then(async (r) => {
      const before = new Set(running().map((x) => x.id));
      state.runs = r.workflow_runs || [];
      // Something just finished: fetch the new data too.
      if ([...before].some((id) => !running().some((x) => x.id === id))) { full = true; state.history = null; }
      // The current step of each running workflow, for the progress bar.
      const live = state.runs.filter((x) => x.status === "in_progress").slice(0, 3);
      const steps = {}, began = {};
      await Promise.all(live.map((x) => ghJson(`/actions/runs/${x.id}/jobs`).then((j) => {
        steps[x.id] = (j.jobs || []).flatMap((jb) => jb.steps || []);
        // When the work really began: a run can wait in line behind another one first.
        const t = (j.jobs || []).map((jb) => jb.started_at).filter(Boolean).sort()[0];
        if (t) began[x.id] = t;
      }).catch(() => {})));
      state.steps = steps; state.began = began;
    })];
    await jobs[0];
    if (!state.history) jobs.push(ghJson("/actions/runs?status=success&per_page=60").then((r) => (state.history = r.workflow_runs || [])).catch(() => {}));
    if (full || !state.data) {
      if (!state.branchKnown) jobs.push(ghJson("").then((r) => { state.branch = r.default_branch || "main"; state.branchKnown = true; }));
      jobs.push(ghJson("/actions/workflows/make-reel.yml/runs?status=success&per_page=10").then((r) => (state.makeRuns = r.workflow_runs || [])).catch(() => {}));
      jobs.push(gh("/contents/data.json?ref=dashboard", { accept: "application/vnd.github.raw+json" }).then(async (r) => {
        if (r.status === 404) { state.noData = true; return; }
        if (!r.ok) throw new Error(r.status + " " + (await r.text()).slice(0, 200));
        state.data = await r.json(); state.noData = false;
      }));
    }
    await Promise.all(jobs);
    state.error = null;
    state.lastLoad = Date.now();
  } catch (e) {
    if (e.message !== "401") state.error = e.status === 404 ? "לא מוצא את הבוט. בדקו שלקוד יש גישה ל-what_if_question." : e.message;
  } finally {
    state.loading = false; render(soft);
  }
}

function pendingReels() {
  const d = state.data;
  const known = new Map((d?.reels || []).map((r) => [r.key, r]));
  const list = (d?.reels || []).filter((r) => r.status === "pending");
  // Reels made before the dashboard existed (or whose dashboard step failed).
  // Older runs were made before the dashboard existed (reel 1, a test copy), so only newer ones count.
  const newest = Math.max(0, ...(d?.reels || []).map((r) => r.number || 0));
  for (const run of state.makeRuns.filter((x) => x.run_number > newest)) {
    const key = "reel-" + run.run_number;
    const age = (Date.now() - new Date(run.created_at).getTime()) / 86400000;
    if (!known.has(key) && age <= 14) list.push({ key, number: run.run_number, title: `סרטון מס' ${run.run_number}`, made_at: run.updated_at || run.created_at, status: "pending", fromRun: run, posts: {} });
  }
  const sent = sentMap();
  // A reel you just decided on leaves this list right away (see History for all reels).
  return list.filter((r) => !(sent[r.key] && Date.now() - sent[r.key].at < 6 * 3600e3))
    .sort((a, b) => (b.number || 0) - (a.number || 0));

function typicalMinutes(name) {
  const done = (state.history || []).filter((r) => r.name === name && r.conclusion === "success" && r.run_started_at)

  const total = typicalMinutes(x.name);
  const steps = state.steps[x.id] || [];
  const byTime = elapsed / total;
  const byStep = steps.length ? steps.filter((s) => s.status === "completed").length / steps.length : 0;
  const pct = Math.max(2, Math.min(elapsed < total ? 97 : 95, Math.round(100 * Math.max(Math.min(byTime, 0.95), byStep * 0.9))));
  const current = steps.find((s) => s.status === "in_progress");
  const left = Math.max(1, Math.round(total - elapsed));

/** The coming posting slots, as the "Publish queue" workflow runs them. */
function upcomingSlots(count) {
  const sch = state.data?.schedule || { slots_utc: ["18:07", "00:07"], daily: 2 };
  const slots = sch.slots_utc.slice(0, Math.max(1, Math.min(sch.daily, sch.slots_utc.length)));
  const busyNow = (state.data?.publish_queue || []).some((q) => q.status === "publishing");
  const out = [];
  const base = new Date(); base.setUTCHours(0, 0, 0, 0);
  for (let day = 0; out.length < count && day < 60; day++) {
    for (const s of slots) {
      const [h, m] = s.split(":").map(Number);
      const t = new Date(base.getTime() + day * 86400e3 + (h * 60 + m) * 60e3);
      if (t.getTime() > Date.now() - (busyNow ? 0 : 5 * 60e3)) out.push(t);
    }
  }
  return out.sort((a, b) => a - b).slice(0, count);
}
function nextSlotText() {
  const queued = (state.data?.publish_queue || []).filter((q) => q.status === "queued").length;
  const t = upcomingSlots(queued + 1)[queued];
  return t ? ilTime(t) : "המועד הבא";
}

      : { t: q.title, f: q.format })

/**
 * Changing the order: the arrows move a reel on this phone right away, and "save" sends the
 * whole new order in one go (several quick runs of the same workflow would drop all but the last).
 * After saving, the new order is kept on this phone until the bot's data shows it (or 5 minutes).

const QORDER_KEY = "wiq.queueOrder";

function numbersView(d) {
  const t = d.totals || {};

  const hasFollowers = PLATFORMS.some((p) => d.platforms?.[p.id]?.followers != null);
  const published = mergedPublished(d).length;

  // The bot keeps the four big numbers checked (views never go down); use them when present.
  const K = d.kpis || { views: t.views ?? 0, likes: t.likes ?? 0, followers, published };
  const chg = (k, now) => {
    if (!prev || prev[k] == null) return "";
    const diff = now - prev[k];
    const pill = diff > 0 ? `<span class="pill up">▲ +${short(diff)}</span>` : diff < 0 ? `<span class="pill down">▼ −${short(-diff)}</span>` : `<span class="pill same">ללא שינוי</span>`;
    return `<div class="chg">${pill}${diff ? `<span class="was">היה ${short(prev[k])}</span>` : ""}</div>`;
  };
  const rows = PLATFORMS.map((p) => {
    const x = d.platforms?.[p.id] || {};

    function cell(key, value) {
      const prior = before?.[key];

      const delta = value - prior;

      return `<td class="n metric-cell">${short(value)} <small class="metric-change ${direction}" dir="ltr" title="במדידה הקודמת ${fmt(prior)}">${sign}${fmt(Math.abs(delta))}</small></td>`;
    }

      <td class="n">${fmt(x.posts || 0)}</td>${cell("views", tt.views)}${cell("likes", tt.likes)}${cell("comments", tt.comments)}${cell("followers", x.followers)}</tr>`;

function chartCard(title, field, d) {
  const series = PLATFORMS.filter((p) => p.id !== "tiktok").map((p) => ({ ...p, pts: d.platforms?.[p.id]?.[field] || [] })).filter((s) => s.pts.length);
  const dates = [...new Set(series.flatMap((s) => s.pts.map((p) => p.date)))].sort();
  if (dates.length < 2) return `<div class="card" style="margin-top:12px"><b class="small">${title}</b><div class="empty">הגרף יופיע אחרי יומיים של נתונים.</div></div>`;
  const W = 340, H = 170, L = 4, R = 40, T = 10, B = 22;
  const max = Math.max(1, ...series.flatMap((s) => s.pts.map((p) => p.v)));
  const nice = niceMax(max);
  const x = (i) => L + (dates.length === 1 ? 0 : (i / (dates.length - 1)) * (W - L - R));
  const y = (v) => T + (1 - v / nice) * (H - T - B);
  const grid = [0, .5, 1].map((f) => `<line x1="${L}" x2="${W - R}" y1="${y(nice * f)}" y2="${y(nice * f)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${W - R + 6}" y="${y(nice * f) + 4}" font-size="12" fill="var(--muted)" text-anchor="start">${short(nice * f)}</text>`).join("");
  const lab = [0, dates.length - 1].map((i) => `<text x="${x(i)}" y="${H - 6}" font-size="12" fill="var(--muted)" text-anchor="${i ? "end" : "start"}">${dates[i].slice(8, 10)}/${dates[i].slice(5, 7)}</text>`).join("");
  const lines = series.map((s) => {
    const pts = s.pts.map((p) => [x(dates.indexOf(p.date)), y(p.v)]);
    const last = pts[pts.length - 1];
    return `<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p) => p.join(",")).join(" ")}"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${s.color}" stroke="var(--card)" stroke-width="2"/>`;
  }).join("");
  const id = "c" + field;
  chartData[id] = { dates, series, x, y, W };
  return `<div class="card" style="margin-top:12px"><b class="small">${title}</b>
    <div class="legend">${series.map((s) => `<span class="pl"><span class="sw" style="background:${s.color}"></span>${s.he}</span>`).join("")}</div>
    <div class="chart-wrap" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${grid}${lab}${lines}
      <line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--muted)" stroke-width="1" opacity="0"/>
      <rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent"/></svg><div class="tip"></div></div></div>`;
}
const chartData = {};
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); return [1, 2, 5, 10].map((m) => m * p).find((m) => m >= v); }
function bindChart(el) {
  const c = chartData[el.dataset.chart]; if (!c) return;
  const svg = $("svg", el), tip = $(".tip", el), xh = $(".xh", el);
  const move = (ev) => {
    const r = svg.getBoundingClientRect();
    const px = ((ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left) / r.width * c.W;
    let best = 0; c.dates.forEach((_, i) => { if (Math.abs(c.x(i) - px) < Math.abs(c.x(best) - px)) best = i; });
    const date = c.dates[best];
    xh.setAttribute("x1", c.x(best)); xh.setAttribute("x2", c.x(best)); xh.setAttribute("opacity", ".6");
    tip.innerHTML = `${date.slice(8, 10)}/${date.slice(5, 7)}<br>` + c.series.map((s) => { const p = s.pts.find((q) => q.date === date); return p ? `${s.he}: ${fmt(p.v)}` : ""; }).filter(Boolean).join("<br>");
    tip.style.left = (c.x(best) / c.W * r.width) + "px"; tip.style.top = "30px"; tip.classList.add("on");
  };
  const out = () => { tip.classList.remove("on"); xh.setAttribute("opacity", "0"); };
  svg.addEventListener("pointermove", move); svg.addEventListener("touchmove", move, { passive: true });
  svg.addEventListener("pointerleave", out); svg.addEventListener("touchend", () => setTimeout(out, 1500));
}

// The same topic re-made or re-posted (e.g. an Instagram-only re-post) counts as one published reel.
// Posts are merged by platform, the newer reel's post winning, and the totals are summed again.
function mergedPublished(d) {
  const groups = new Map();
  const key = (t) => String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  [...(d.reels || [])].filter((r) => r.status === "published").sort((a, b) => (a.number || 0) - (b.number || 0)).forEach((r) => {
    const g = groups.get(key(r.title));
    if (!g) { groups.set(key(r.title), { ...r, posts: { ...(r.posts || {}) } }); return; }
    Object.assign(g.posts, r.posts || {});
    g.number = r.number;
  });
  return [...groups.values()].map((g) => {
    const totals = {};
    Object.values(g.posts).forEach((x) => Object.entries(x.numbers || {}).forEach(([k, v]) => { if (typeof v === "number" && ["views", "likes", "comments", "shares", "saves"].includes(k)) totals[k] = (totals[k] || 0) + v; }));
    const first = Object.values(g.posts).map((x) => x.posted_at).filter(Boolean).sort()[0] || "";
    return { ...g, totals, first };
  }).sort((a, b) => (b.first || "").localeCompare(a.first || "") || (b.number || 0) - (a.number || 0)); // newest post first
}

    const n = b.dataset.now;
    const q = (state.data?.publish_queue || []).find((x) => x.number == n);
    const { platforms, variant } = q ? { platforms: q.platforms.length === 4 ? "everywhere" : q.platforms[0], variant: q.variant } : choice(n);
    confirmSheet("לפרסם עכשיו?", `סרטון #${n} יפורסם ${WHERE_HE[platforms]} עכשיו, בכל הפלטפורמות כמעט באותו זמן (בלי המרווחים של התור). זה פומבי.`, "כן, פרסם עכשיו", async () => {
      await dispatch("publish.yml", { reel: String(n), platforms, variant });
      markSent("reel-" + n, "publish");
      toast("נשלח! הבוט מפרסם עכשיו. בעוד כמה דקות הקישורים יופיעו כאן.");
      setTimeout(() => load(false), 4000);
      render();
    });
  }));
  document.querySelectorAll("[data-mv]").forEach((b) => (b.onclick = (e) => {
    e.stopPropagation();
    const list = queuedInOrder(state.data || {}).map((x) => x.number);
    const i = list.indexOf(Number(b.dataset.mv)), j = i + Number(b.dataset.dir);
    if (i < 0 || j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    // Kept on this phone at once (a refresh shows it too), and sent to the bot 2 seconds after the
    // last tap. Each run carries the whole order, so the last one always wins.
    state.qorder = list;
    store.set(QORDER_KEY, JSON.stringify({ order: list, at: Date.now() }));
    state.qsaving = "wait";
    clearTimeout(state.qtimer);
    state.qtimer = setTimeout(saveOrder, 2000);
    render();
  }));
  document.querySelectorAll("[data-analysis]").forEach((b) => (b.onclick = analysisSheet));
  document.querySelectorAll("[data-qsel]").forEach((el) => (el.onclick = () => {
    const n = Number(el.dataset.qsel);
    state.qsel = state.qsel === n ? null : n;
    render();
  }));
  document.querySelectorAll("[data-unqueue]").forEach((b) => (b.onclick = () => {
    const n = b.dataset.unqueue;
    confirmSheet("להוציא מהתור?", `סרטון #${n} יחזור לרשימת "מחכים לאישור" ולא יתפרסם.`, "הוצא מהתור", async () => {
      await dispatch("review-reel.yml", { reel: String(n), decision: "unqueue" });
      markSent("reel-" + n, "unqueue");
      toast("יוצא מהתור. זה יתעדכן בעוד דקה.");
      setTimeout(() => load(true), 60000);
      render();
    });
  }));
  document.querySelectorAll("[data-reject]").forEach((b) => (b.onclick = () => {
    const n = b.dataset.reject;
    confirmSheet("לדחות את הסרטון?", `סרטון #${n} לא יפורסם ויוסר מהרשימה. אפשר לכתוב למה (לא חובה):`, "דחה", async (note) => {
      await dispatch("review-reel.yml", { reel: String(n), decision: "reject", note: note || "" });
      markSent("reel-" + n, "reject");
      toast("נדחה. הוא לא יוצע שוב.");
      render();
    }, true);
  }));
  // Deleting a coming topic takes two taps on the ✕ and then a confirm, so it can't happen by mistake.
  document.querySelectorAll("[data-drop]").forEach((b) => (b.onclick = () => {
    const t = b.dataset.drop;
    if (!b.classList.contains("armed")) {
      b.classList.add("armed"); b.textContent = "למחוק?";
      setTimeout(() => { b.classList.remove("armed"); b.textContent = "✕"; }, 4000);
      return;
    }
    confirmSheet("למחוק את הנושא?", `"${t}" יימחק מהרשימה ולא ייעשה ממנו סרטון. הבוט יוסיף רעיון חדש במקומו תוך 2 עד 3 דקות.`, "מחק", async () => {
      await dispatch("dashboard.yml", { drop_topic: t });
      const m = droppedMap(); m[t] = Date.now(); store.set(DROP_KEY, JSON.stringify(m));
      toast("נמחק. רעיון חדש יופיע בעוד כמה דקות.");
      render();
    });
  }));
  document.querySelectorAll("[data-run]").forEach((b) => (b.onclick = async () => {
    b.disabled = true;
    try { await dispatch(b.dataset.run, {}); toast("התחיל. התוצאה תופיע כאן בעוד דקה או שתיים."); setTimeout(() => load(false), 4000); }
    catch (e) { toast(e.message, 6000); } finally { b.disabled = false; }
  }));
  const mk = $("[data-make]");
  if (mk) mk.onclick = () => {
    // An empty field means the next topic shown in the list. It is sent by name, so the bot makes
    // exactly the topic shown here, even if a deletion has not reached the bot yet.
    const topic = $("#topic").value.trim() || upcoming(state.data || {})[0]?.t || "";
    confirmSheet("ליצור סרטון חדש?", topic ? `נושא: ${topic}` : "הבוט ייקח את הנושא הבא בתור.", "צור", async () => {
      await dispatch("make-reel.yml", topic ? { topic } : {});
      toast("הבוט התחיל להכין סרטון. זה לוקח בערך 20 דקות.");
      $("#topic").value = "";
      setTimeout(() => load(false), 4000);
    });
  };
}

const STATUS_HE = {
  pending: ["מחכה לאישור", "var(--warn)"], queued: ["בתור לפרסום", "var(--accent)"], published: ["פורסם", "var(--good)"],
  rejected: ["נדחה", "var(--bad)"], expired: ["לא פורסם (פג תוקף)", "var(--muted)"],
};
function openHistory() {
  const d = state.data || {};
  const sent = sentMap();
  const list = (d.reels || []).slice().sort((a, b) => (b.number || 0) - (a.number || 0));
  const rows = list.map((r) => {
    let st = r.status;
    const s = sent[r.key];
    if (s && Date.now() - s.at < 6 * 3600e3 && st === "pending") st = s.what === "reject" ? "rejected" : "queued";
    const [label, color] = STATUS_HE[st] || [st, "var(--muted)"];
    const links = PLATFORMS.filter((p) => r.posts?.[p.id]?.url).map((p) => `<a href="${esc(r.posts[p.id].url)}" target="_blank" rel="noopener">${p.he}</a>`).join(" · ");
    const when = r.made_at ? utc(r.made_at) : null;
    return `<div class="pub"><div class="row split" style="flex-wrap:nowrap;align-items:flex-start">
        <div style="min-width:0"><div class="t"><span class="chip">#${r.number ?? "?"}</span> ${esc(r.title)}</div>
        <div class="small muted">${when ? ilTime(when) : ""}${r.totals?.views ? " · " + short(r.totals.views) + " צפיות" : ""}${r.note ? " · " + esc(r.note) : ""}</div>
        ${links ? `<div class="small" style="margin-top:4px">${links}</div>` : ""}</div>
        <span class="chip" style="color:${color};flex:none">${label}</span></div></div>`;
  }).join("");
  const bg = $("#sheet"), body = $("#sheetBody");
  body.innerHTML = `<div class="row split"><h3 style="margin:0">היסטוריה: כל הסרטונים</h3><button class="btn-ghost" id="no">סגור</button></div>
    <div style="max-height:70vh;overflow-y:auto;margin-top:8px">${rows || '<div class="empty">עוד אין סרטונים.</div>'}</div>`;
  bg.classList.add("on");
  const close = () => bg.classList.remove("on");
  $("#no").onclick = close;
  bg.onclick = (e) => { if (e.target === bg) close(); };
}

function confirmSheet(title, text, okLabel, onOk, withNote) {
  const bg = $("#sheet"), body = $("#sheetBody");
  body.innerHTML = `<h3>${esc(title)}</h3><div class="muted">${esc(text)}</div>
    ${withNote ? `<textarea id="note" rows="2" style="margin-top:10px" placeholder="למשל: הנושא משעמם, הקול מהיר מדי"></textarea>` : ""}
    <div class="row"><button class="btn-ghost" id="no">ביטול</button><button class="btn-primary" id="yes">${esc(okLabel)}</button></div>`;
  bg.classList.add("on");
  const close = () => bg.classList.remove("on");
  $("#no").onclick = close;
  bg.onclick = (e) => { if (e.target === bg) close(); };
  $("#yes").onclick = async () => {
    const y = $("#yes"); y.disabled = true; y.innerHTML = '<span class="spin"></span>';
    try { await onOk(withNote ? $("#note").value.trim() : undefined); close(); }
    catch (e) { close(); toast(e.message, 7000); }
  };
}

// ---- page updates -------------------------------------------------------------------------
// The browser keeps a copy of this page for up to 10 minutes. Every minute (and when the
// phone comes back to it) the page asks the site for its newest version, skipping that copy,
// and switches to it as soon as it differs, so changes show up without a manual refresh.
const BUILD = "2026-11-22-132527";
async function checkForNewPage() {
  try {
    const r = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const m = (await r.text()).match(new RegExp("^const " + "BUILD = \"([^\"]+)\"", "m"));
    // Already tried this version once (the site may still be catching up): don't loop.
    const tried = new URLSearchParams(location.search).get("v");
    if (m && m[1] !== BUILD && m[1] !== tried && !busy()) location.replace(location.pathname + "?v=" + m[1]);
  } catch { /* offline: try again later */ }
}
setInterval(() => { if (document.visibilityState === "visible") checkForNewPage(); }, 60e3);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkForNewPage(); });
checkForNewPage();

// ---- start --------------------------------------------------------------------------------
render();
if (token) load(true);
// While the bot is working, refresh the progress every 20 seconds.
setInterval(() => {
  if (token && document.visibilityState === "visible" && running().length && !state.loading) load(false, true);
}, 20e3);
setInterval(() => {
  if (!token || document.visibilityState !== "visible") return;
  if (state.dirty && !busy()) render();
  load(Date.now() - state.lastLoad > 5 * 60e3, true);
}, 60e3);
document.addEventListener("visibilitychange", () => { if (token && document.visibilityState === "visible" && Date.now() - state.lastLoad > 30e3) load(true); });
</script>
</body>
